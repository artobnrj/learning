[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturectl"
version = "1.0.0"
description = "Control your desktop with hand gestures from a webcam (MediaPipe + pynput)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.14",   # brings opencv-contrib-python (with GUI support)
    "numpy>=1.23",
    "pynput>=1.7.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gesturectl = "gesturectl.cli:main"

[tool.setuptools]
packages = ["gesturectl", "gesturectl.actions"]

[tool.setuptools.package-data]
gesturectl = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
